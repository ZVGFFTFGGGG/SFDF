name: download
run-name: dl-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request ID"
        required: true
        type: string
      url:
        description: "Target URL"
        required: true
        type: string
      quality:
        description: "Quality preset (best, 1080, 720, 480, audio)"
        required: false
        default: "best"
        type: string
      mode:
        description: "Download mode (video, collection, list)"
        required: false
        default: "video"
        type: string
      urls:
        description: "JSON list of URLs for list mode"
        required: false
        default: ""
        type: string
      cookies_enc:
        description: "AES-256-GCM encrypted cookies"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate request id
        run: |
          if [[ ! "${{ inputs.request_id }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid request ID"
            exit 1
          fi

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg zip python3-cryptography
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Decrypt cookies
        if: ${{ inputs.cookies_enc != '' }}
        env:
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          python3 - << 'EOF'
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          enc_b64 = os.environ.get("COOKIES_ENC", "").strip()
          hex_key = os.environ.get("COOKIE_KEY", "").strip()
          if not enc_b64 or len(hex_key) != 64:
              raise SystemExit("::error::COOKIE_KEY missing or invalid in repository secrets")
          raw = base64.b64decode(enc_b64)
          plain = AESGCM(bytes.fromhex(hex_key)).decrypt(raw[:12], raw[12:], None)
          with open("/tmp/cookies.txt", "wb") as f:
              f.write(plain)
          EOF

      - name: Download
        env:
          TARGET_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
          MODE: ${{ inputs.mode }}
          URLS_JSON: ${{ inputs.urls }}
        run: |
          mkdir -p /tmp/out
          COOKIE_ARGS=""
          [ -f /tmp/cookies.txt ] && COOKIE_ARGS="--cookies /tmp/cookies.txt"

          case "$QUALITY" in
            audio) FMT_ARGS="-x --audio-format mp3 --audio-quality 0" ;;
            1080)  FMT_ARGS="-f bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best[height<=1080] --merge-output-format mp4" ;;
            720)   FMT_ARGS="-f bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720] --merge-output-format mp4" ;;
            480)   FMT_ARGS="-f bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]/best[height<=480] --merge-output-format mp4" ;;
            *)     FMT_ARGS="-f bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best --merge-output-format mp4" ;;
          esac

          if [ "$MODE" = "list" ] && [ -n "$URLS_JSON" ]; then
            python3 -c 'import os, json; open("/tmp/urls.txt", "w").write("\n".join(json.loads(os.environ["URLS_JSON"])))'
            yt-dlp $COOKIE_ARGS $FMT_ARGS --no-playlist -a /tmp/urls.txt -o "/tmp/out/%(title).150B [%(id)s].%(ext)s"
          elif [ "$MODE" = "collection" ]; then
            yt-dlp $COOKIE_ARGS $FMT_ARGS --yes-playlist --playlist-end 200 -o "/tmp/out/%(playlist_title,channel)s/%(title).150B [%(id)s].%(ext)s" "$TARGET_URL"
          else
            yt-dlp $COOKIE_ARGS $FMT_ARGS --no-playlist -o "/tmp/out/%(title).150B [%(id)s].%(ext)s" "$TARGET_URL"
          fi

          if [ -z "$(ls -A /tmp/out)" ]; then
            echo "::error::לא ירדו קבצים מהקישור"
            exit 1
          fi

          mkdir -p /tmp/pkg
          cd /tmp/out
          zip -r -0 "/tmp/pkg/dl-${{ inputs.request_id }}.zip" .

      - name: Always drop cookies
        if: always()
        run: rm -f /tmp/cookies.txt /tmp/urls.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dl-${{ inputs.request_id }}
          path: /tmp/pkg/dl-${{ inputs.request_id }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publish Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dl-${{ inputs.request_id }}"
          gh release create "$TAG" "/tmp/pkg/dl-${{ inputs.request_id }}.zip" --title "$TAG" --notes "Temp" --prerelease
