<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <title>YouTube Proxy — הגדרות</title>
  <link rel="stylesheet" href="shared/theme.css"/>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h2>בדיקת חיבור</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text" style="flex:1;">טרם נבדק</span>
        <button class="btn" id="recheck" type="button">בדוק חיבור</button>
      </div>
    </section>
    <section class="card">
      <h2>הגדרות מאגר GitHub</h2>
      <label class="small muted">שם משתמש (owner)</label>
      <input id="owner" class="input" dir="ltr"/>
      <label class="small muted">שם מאגר (repo)</label>
      <input id="repo" class="input" dir="ltr"/>
      <label class="small muted">קובץ Workflow</label>
      <input id="workflow" class="input" dir="ltr"/>
      <label class="small muted">ענף (ref)</label>
      <input id="ref" class="input" dir="ltr"/>
      <label class="small muted">טוקן GitHub</label>
      <input id="token" class="input" type="password" dir="ltr"/>
      <label class="small muted">COOKIE_KEY (64 תווי hex)</label>
      <input id="cookieKey" class="input" dir="ltr"/>
      <label class="small muted">Update Owner (אופציונלי)</label>
      <input id="updateOwner" class="input" dir="ltr"/>
      <label class="small muted">Update Repo (אופציונלי)</label>
      <input id="updateRepo" class="input" dir="ltr"/>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn--primary" id="save" type="button">שמור הגדרות</button>
        <button class="btn btn--danger" id="reset" type="button">אפס</button>
      </div>
      <p id="msg" class="small"></p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
